        // --- FETCH DATA FROM GOOGLE SHEETS CSV (HYBRID MODE) ---
        async function loadProductsFromSheets() {
            try {
                // 1. KITA LOAD DULU DATA BAWAAN LU BIAR GA KOSONG
                productsData = JSON.parse(JSON.stringify(dataBawaan));

                // 2. LALU KITA SEDOT DATA DARI GOOGLE SHEETS
                const response = await fetch(csvUrl);
                const data = await response.text();
                const baris = data.split('\n');

                // Mulai dari index 1 (melewati header baris 1)
                for (let i = 1; i < baris.length; i++) {
                    if (baris[i].trim() === '') continue;

                    const kolom = baris[i].split(',');
                    if (kolom.length < 5) continue;

                    const name = kolom[0].trim();
                    const price = parseFloat(kolom[1].trim()) || 0;
                    const img = kolom[2].trim();
                    const desc = kolom[3].trim();
                    const categoryName = kolom[4].trim().toLowerCase();

                    const id = 'sheet_prod_' + i; // ID khusus buat data dari Sheet

                    // Cocokkan kategori dari Sheet dengan ID atau nama Divisi
                    let targetDivId = 'lemari'; // Default fallback
                    divisions.forEach(div => {
                        if (categoryName.includes(div.id.toLowerCase()) || categoryName.includes(div.name.toLowerCase())) {
                            targetDivId = div.id;
                        }
                    });

                    // 3. TAMBAHIN DATA DARI SHEET KE DALAM WADAH PRODUK
                    if (productsData[targetDivId]) {
                        productsData[targetDivId].push({ id, name, price, img, desc });
                    }
                }
            } catch (error) {
                console.error("Gagal mengambil data katalog dari Google Sheets:", error);
            }
        }

        function getProductById(id) {
            for (const category in productsData) {
                const foundProduct = productsData[category].find(p => p.id === id);
                if (foundProduct) return foundProduct;
            }
            return null;
        }

                `;

                card.onclick = () => openCatalog(div);
                container.appendChild(card);
            });

            setupScrollAnimations();
        }

        function setupScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-swing');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.swing-on-scroll').forEach(el => observer.observe(el));
        }

                        <div class="font-black text-slate-900 text-sm mb-4">${formatRupiah(prod.price)}</div>
                        
                        <div id="action-${prod.id}" class="mt-auto">
                            ${qty === 0 ? `
                                <button onclick="updateCart('${prod.id}', 1)" class="w-full bg-slate-800 hover:bg-black text-white text-xs font-bold py-2.5 rounded-xl transition-colors flex justify-center items-center gap-1 active:scale-95 shadow-sm shadow-slate-800/30">
                                    <i class="fas fa-plus"></i> Tambah
                                </button>
                            ` : `
                                <div class="flex items-center justify-between bg-slate-50 rounded-xl p-1 border border-slate-200">
                                    <button onclick="updateCart('${prod.id}', -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm text-slate-600 active:scale-95">
                                        <i class="fas fa-minus text-xs"></i>
                                    </button>
                                    <span class="font-bold text-sm w-8 text-center text-slate-800">${qty}</span>
                                    <button onclick="updateCart('${prod.id}', 1)" class="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-lg shadow-sm text-white active:scale-95">
                                        <i class="fas fa-plus text-xs"></i>
                                    </button>
                                </div>
                            `}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- FUNGSI UPDATE UI PINTAR ---
        function updateProductCardUI(productId) {
            const qty = cart[productId] || 0;
            
            const badgeContainer = document.getElementById(`badge-${productId}`);
            if (badgeContainer) {
                badgeContainer.innerHTML = qty > 0 
                    ? `<div class="absolute top-2 right-2 bg-slate-800 text-white text-xs font-bold w-7 h-7 rounded-full flex items-center justify-center z-10 shadow-lg border-2 border-white">${qty}</div>`
                    : '';
            }

            const actionContainer = document.getElementById(`action-${productId}`);
            if (actionContainer) {
                actionContainer.innerHTML = qty === 0 
                    ? `
                        <button onclick="updateCart('${productId}', 1)" class="w-full bg-slate-800 hover:bg-black text-white text-xs font-bold py-2.5 rounded-xl transition-colors flex justify-center items-center gap-1 active:scale-95 shadow-sm shadow-slate-800/30">
                            <i class="fas fa-plus"></i> Tambah
                        </button>
                    ` 
                    : `
                        <div class="flex items-center justify-between bg-slate-50 rounded-xl p-1 border border-slate-200">
                            <button onclick="updateCart('${productId}', -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm text-slate-600 active:scale-95">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <span class="font-bold text-sm w-8 text-center text-slate-800">${qty}</span>
                            <button onclick="updateCart('${productId}', 1)" class="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-lg shadow-sm text-white active:scale-95">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                        </div>
                    `;
            }
        }

        // --- IMAGE ZOOM (LIGHTBOX) LOGIC ---
        function openImageZoom(productId) {
            const product = getProductById(productId);
            if (!product) return;

            const modal = document.getElementById('imageZoomModal');
            const img = document.getElementById('zoomedImage');
            const title = document.getElementById('zoomedImageTitle');

            img.src = product.img;
            title.innerText = product.name;

            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            
            img.classList.remove('scale-95');
            img.classList.add('scale-100');
        }

        function closeImageZoom() {
            const modal = document.getElementById('imageZoomModal');
            const img = document.getElementById('zoomedImage');

            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            
            img.classList.remove('scale-100');
            img.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // --- CART LOGIC ---
        function updateCart(productId, change) {
            const currentQty = cart[productId] || 0;
            const newQty = currentQty + change;

            if (newQty <= 0) {
                delete cart[productId];
            } else {
                cart[productId] = newQty;
            }

            updateProductCardUI(productId); 
            updateCartUI();
            
            if(!document.getElementById('cartModal').classList.contains('hidden')) {
                renderCartModal();
            }
        }

        function getCartDetails() {
            let totalItems = 0;
            let totalPrice = 0;
            let items = [];

            for (const [id, qty] of Object.entries(cart)) {
                const product = getProductById(id);
                if (product) {
                    totalItems += qty;
                    totalPrice += (product.price * qty);
                    items.push({ product, qty });
                }
            }

            return { totalItems, totalPrice, items };
        }

        function updateCartUI() {
            const { totalItems, totalPrice } = getCartDetails();
            const badge = document.getElementById('cartBadge');
            const totalPreview = document.getElementById('cartTotalPreview');

            if (totalItems > 0) {
                badge.innerText = totalItems;
                badge.classList.remove('hidden');
                totalPreview.innerText = formatRupiah(totalPrice);
            } else {
                badge.classList.add('hidden');
                totalPreview.innerText = 'Rp 0';
            }
        }

        // --- CART MODAL ---
        function openCart() {
            const modal = document.getElementById('cartModal');
            const content = document.getElementById('cartContent');
            
            modal.classList.remove('hidden');
            void modal.offsetWidth; 
            
            modal.classList.add('opacity-100');
            modal.classList.remove('opacity-0');
            
            content.classList.remove('translate-y-full');
            content.classList.add('translate-y-0');

            renderCartModal();
        }

        function closeCart() {
            const modal = document.getElementById('cartModal');
            const content = document.getElementById('cartContent');
            
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            
            content.classList.remove('translate-y-0');
            content.classList.add('translate-y-full');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); 
        }

        function renderCartModal() {
            const listContainer = document.getElementById('cartItemsList');
            const emptyMsg = document.getElementById('emptyCartMessage');
            const finalTotal = document.getElementById('finalTotal');
            const formSection = document.getElementById('customerFormSection');
            
            const { items, totalPrice } = getCartDetails();

            finalTotal.innerText = formatRupiah(totalPrice);

            if (items.length === 0) {
                listContainer.innerHTML = '';
                emptyMsg.classList.remove('hidden');
                formSection.classList.add('hidden');
                return;
            }

            emptyMsg.classList.add('hidden');
            formSection.classList.remove('hidden');
            
            let html = '';

            items.forEach(({ product, qty }) => {
                html += `
                    <div class="flex items-center gap-4 bg-white p-3 rounded-[20px] border border-slate-200 shadow-sm">
                        <img src="${product.img}" alt="${product.name}" loading="lazy" class="w-16 h-16 rounded-xl object-cover bg-slate-50 shrink-0" onerror="this.src='https://placehold.co/400x400/f1f5f9/0f172a?text=Foto'">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-sm leading-tight text-slate-800 truncate">${product.name}</h4>
                            <div class="text-slate-900 font-black text-sm mt-1">${formatRupiah(product.price)}</div>
                        </div>
                        <div class="flex items-center bg-slate-50 rounded-xl p-1 border border-slate-200 shrink-0 shadow-sm">
                            <button onclick="updateCart('${product.id}', -1)" class="w-7 h-7 flex items-center justify-center text-slate-500 hover:text-black bg-white rounded-lg shadow-sm active:scale-95 transition-all">
                                <i class="fas fa-minus text-[10px]"></i>
                            </button>
                            <span class="font-bold text-sm w-7 text-center text-slate-800">${qty}</span>
                            <button onclick="updateCart('${product.id}', 1)" class="w-7 h-7 flex items-center justify-center text-white bg-slate-800 rounded-lg shadow-sm active:scale-95 transition-all">
                                <i class="fas fa-plus text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            listContainer.innerHTML = html;
        }

        // --- WHATSAPP INTEGRATION ---
        function checkoutToWA() {
            const { items, totalPrice } = getCartDetails();
            
            if (items.length === 0) {
                alert("Keranjang Anda masih kosong.");
                return;
            }

            const custName = document.getElementById('custName').value.trim();
            const custWA = document.getElementById('custWA').value.trim();
            const custAddress = document.getElementById('custAddress').value.trim();

            if (!custName || !custWA || !custAddress) {
                alert("Mohon lengkapi Nama, No. WhatsApp, dan Alamat Anda sebelum melanjutkan pesanan.");
                return;
            }

            let message = `Halo Admin *Nitta Group*, saya ingin melakukan pemesanan.\n\n`;
            
            message += `*📋 DATA PEMESAN*\n`;
            message += `▪️ Nama : ${custName}\n`;
            message += `▪️ No. WA : ${custWA}\n`;
            message += `▪️ Alamat : ${custAddress}\n\n`;

            message += `*🛍️ RINCIAN PESANAN*\n`;
            items.forEach((item) => {
                message += `▪️ *${item.product.name}*\n`;
                message += `   ${item.qty} x ${formatRupiah(item.product.price)} = ${formatRupiah(item.product.price * item.qty)}\n`;
            });

            message += `\n*Total Harga: ${formatRupiah(totalPrice)}*\n\n`;
            message += `Mohon dibantu info total biaya beserta ongkos kirim ke alamat saya ya. Terima kasih! 🙏`;

            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${waNumber}?text=${encodedMessage}`;
            
            window.open(waUrl, '_blank');
        }

        // --- INIT ---
        window.onload = async () => {
            renderDivisions();
            await loadProductsFromSheets(); // Sedot data kombinasi (bawaan + google sheet) saat buka web
        };
    </script>
